<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Гусландский Переводчик</title>

    <!-- PWA -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1a1a1c">

    <!-- iOS PWA -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Гусланд">
    <link rel="apple-touch-icon" href="icon-192.png">
    <link rel="icon" type="image/png" href="icon-192.png">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            --bg-overlay: rgba(20, 20, 22, 0.55);
            --card-bg: rgba(255, 255, 255, 0.08);
            --card-border: rgba(255, 255, 255, 0.15);
            --text-primary: #f5f5f7;
            --text-secondary: rgba(245, 245, 247, 0.65);
            --text-muted: rgba(245, 245, 247, 0.4);
            --accent: #ffffff;
            --input-bg: rgba(255, 255, 255, 0.06);
            --input-border: rgba(255, 255, 255, 0.12);
            --input-focus: rgba(255, 255, 255, 0.35);
            --radius: 16px;
            --radius-sm: 12px;
        }

        html,
        body {
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter',
                Roboto, 'Helvetica Neue', Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        body {
            background-color: #1a1a1c;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            position: relative;
            min-height: 100vh;
            /* iOS safe area — для «брови» на iPhone */
            padding-top: max(24px, env(safe-area-inset-top));
            padding-bottom: max(24px, env(safe-area-inset-bottom));
            padding-left: max(24px, env(safe-area-inset-left));
            padding-right: max(24px, env(safe-area-inset-right));
            overflow-x: hidden;
        }

        /* Поддержка dvh для новых устройств (iOS 15.4+) */
        @supports (height: 100dvh) {
            body {
                min-height: 100dvh;
            }
        }

        #bgCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            display: block;
            pointer-events: none;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: var(--bg-overlay);
            z-index: 1;
            pointer-events: none;
        }

        .card {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 640px;
            background: var(--card-bg);
            -webkit-backdrop-filter: blur(24px) saturate(140%);
            backdrop-filter: blur(24px) saturate(140%);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            padding: 40px 36px;
            box-shadow:
                0 20px 60px rgba(0, 0, 0, 0.35),
                inset 0 1px 0 rgba(255, 255, 255, 0.08);
            animation: cardIn 0.7s cubic-bezier(0.16, 1, 0.3, 1);
            transition: box-shadow 0.4s ease, transform 0.4s ease, border-color 0.4s ease;
        }

        .card:hover {
            box-shadow:
                0 28px 80px rgba(0, 0, 0, 0.5),
                0 0 0 1px rgba(255, 255, 255, 0.06),
                inset 0 1px 0 rgba(255, 255, 255, 0.12);
            border-color: rgba(255, 255, 255, 0.22);
        }

        @keyframes cardIn {
            from {
                opacity: 0;
                transform: translateY(24px) scale(0.98);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .header {
            text-align: center;
            margin-bottom: 32px;
            animation: fadeIn 0.9s ease 0.15s both;
        }

        .header h1 {
            font-size: 26px;
            font-weight: 600;
            letter-spacing: -0.02em;
            color: var(--text-primary);
            margin-bottom: 6px;
            animation: breathe 4s ease-in-out infinite;
        }

        @keyframes breathe {

            0%,
            100% {
                opacity: 1;
                text-shadow: 0 0 0 rgba(255, 255, 255, 0);
            }

            50% {
                opacity: 0.92;
                text-shadow: 0 0 18px rgba(255, 255, 255, 0.15);
            }
        }

        .header p {
            font-size: 13px;
            color: var(--text-secondary);
            letter-spacing: 0.01em;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(8px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .field {
            margin-bottom: 18px;
            animation: fadeIn 0.9s ease 0.25s both;
        }

        .field:nth-of-type(2) {
            animation-delay: 0.4s;
        }

        .field label {
            display: block;
            font-size: 12px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--text-secondary);
            margin-bottom: 8px;
            transition: color 0.3s ease;
        }

        .field:focus-within label {
            color: var(--text-primary);
        }

        textarea {
            width: 100%;
            min-height: 110px;
            padding: 14px 16px;
            background: var(--input-bg);
            border: 1px solid var(--input-border);
            border-radius: var(--radius-sm);
            color: var(--text-primary);
            font-family: inherit;
            font-size: 15px;
            line-height: 1.5;
            resize: vertical;
            transition: border-color 0.3s ease,
                background 0.3s ease,
                box-shadow 0.3s ease,
                transform 0.3s ease;
            /* iOS: убираем внутренние тени */
            -webkit-appearance: none;
            appearance: none;
        }

        textarea::placeholder {
            color: var(--text-muted);
            transition: color 0.3s ease;
        }

        textarea:focus {
            outline: none;
            border-color: var(--input-focus);
            background: rgba(255, 255, 255, 0.09);
            box-shadow: 0 0 0 4px rgba(255, 255, 255, 0.04);
            transform: translateY(-1px);
        }

        textarea:focus::placeholder {
            color: rgba(245, 245, 247, 0.25);
        }

        .btn {
            position: relative;
            width: 100%;
            padding: 14px 20px;
            margin: 4px 0 20px;
            background: var(--accent);
            color: #1a1a1c;
            border: none;
            border-radius: var(--radius-sm);
            font-family: inherit;
            font-size: 15px;
            font-weight: 600;
            letter-spacing: 0.01em;
            cursor: pointer;
            overflow: hidden;
            -webkit-appearance: none;
            appearance: none;
            transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1),
                opacity 0.25s ease,
                box-shadow 0.3s ease;
            animation: fadeIn 0.9s ease 0.35s both;
        }

        .btn::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: radial-gradient(circle at center, rgba(102, 126, 234, 0.25), transparent 70%);
            opacity: 0;
            transition: opacity 0.4s ease;
            pointer-events: none;
        }

        .btn:hover {
            opacity: 0.96;
            transform: translateY(-2px);
            box-shadow: 0 12px 32px rgba(255, 255, 255, 0.18);
        }

        .btn:hover::after {
            opacity: 1;
        }

        .btn:active {
            transform: translateY(0) scale(0.99);
            opacity: 0.9;
        }

        .output-wrapper {
            position: relative;
        }

        .output {
            min-height: 90px;
            padding: 16px 16px 50px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--input-border);
            border-radius: var(--radius-sm);
            color: var(--text-primary);
            font-size: 15px;
            line-height: 1.6;
            white-space: pre-wrap;
            word-wrap: break-word;
            overflow-wrap: break-word;
            transition: background 0.3s ease,
                border-color 0.3s ease,
                box-shadow 0.3s ease;
            /* iOS: правильный перенос длинных слов */
            -webkit-hyphens: auto;
            hyphens: auto;
        }

        .output:not(:empty) {
            animation: outputIn 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes outputIn {
            from {
                opacity: 0.4;
                transform: translateY(4px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .output:empty::before {
            content: 'Здесь появится перевод…';
            color: var(--text-muted);
        }

        .output:hover {
            background: rgba(255, 255, 255, 0.06);
        }

        .copy-btn {
            position: absolute;
            bottom: 10px;
            right: 10px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 7px 12px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid var(--input-border);
            border-radius: 8px;
            color: var(--text-primary);
            font-family: inherit;
            font-size: 12px;
            font-weight: 500;
            letter-spacing: 0.02em;
            cursor: pointer;
            opacity: 0;
            pointer-events: none;
            transform: translateY(4px);
            -webkit-appearance: none;
            appearance: none;
            transition: background 0.25s ease,
                transform 0.3s cubic-bezier(0.16, 1, 0.3, 1),
                opacity 0.3s ease,
                border-color 0.25s ease;
        }

        .copy-btn.visible {
            opacity: 1;
            pointer-events: auto;
            transform: translateY(0);
        }

        .copy-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-1px);
        }

        .copy-btn:active {
            transform: scale(0.96);
        }

        .copy-btn.copied {
            background: rgba(120, 220, 160, 0.25);
            border-color: rgba(120, 220, 160, 0.5);
            color: #b8f5cf;
        }

        .copy-btn svg {
            width: 13px;
            height: 13px;
            flex-shrink: 0;
            transition: transform 0.3s ease;
        }

        .copy-btn:hover svg {
            transform: rotate(-6deg) scale(1.1);
        }

        .stats {
            text-align: center;
            margin-top: 18px;
            font-size: 11px;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            color: var(--text-muted);
            animation: fadeIn 1s ease 0.5s both;
            word-wrap: break-word;
        }

        @media (max-width: 600px) {
            body {
                padding: 16px;
                padding-top: max(16px, env(safe-area-inset-top));
                padding-bottom: max(16px, env(safe-area-inset-bottom));
                align-items: center;
            }

            .card {
                padding: 28px 22px;
                border-radius: 20px;
            }

            .header {
                margin-bottom: 24px;
            }

            .header h1 {
                font-size: 22px;
            }

            textarea {
                min-height: 96px;
                font-size: 16px;
            }

            .output {
                font-size: 15px;
            }

            .btn {
                padding: 15px 20px;
                font-size: 16px;
            }
        }

        @media (max-width: 380px) {
            .card {
                padding: 24px 18px;
            }

            .header h1 {
                font-size: 20px;
            }
        }

        @media (prefers-reduced-motion: reduce) {

            *,
            *::before,
            *::after {
                animation-duration: 0.001ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.001ms !important;
            }
        }
    </style>
</head>

<body>
    <canvas id="bgCanvas"></canvas>

    <main class="card">
        <header class="header">
            <h1>Гусландский переводчик</h1>
            <p>Перевод с обычного русского на гусландский.</p>
        </header>

        <div class="field">
            <label for="input">Исходный текст</label>
            <textarea id="input" placeholder="Напиши здесь чото..."></textarea>
        </div>

        <button class="btn" id="translateBtn" type="button">Перевести</button>

        <div class="field">
            <label for="output">Результат</label>
            <div class="output-wrapper">
                <div class="output" id="output" aria-live="polite"></div>
                <button class="copy-btn" id="copyBtn" type="button" aria-label="Скопировать">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                        <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                    </svg>
                    <span id="copyBtnText">Скопировать</span>
                </button>
            </div>
        </div>

        <div class="stats" id="stats"></div>
    </main>

        /* ============================================================
           НАСТРОЙКИ
           ============================================================ */
        const PREFIXES = ["лe ", "ай дa "];
        const PREFIX_CHANCE = 0.1;
        const E_I_CHANCE = 0.2;

        /* ============================================================
           ЗАМЕНА БУКВ е→i, и→i (без for...of — только индекс)
           ============================================================ */
        function applyEI(text) {
            if (!text) return '';
            var result = '';
            for (var i = 0; i < text.length; i++) {
                var ch = text.charAt(i);
                var lower = ch.toLowerCase();
                if ((lower === 'е' || lower === 'и') && Math.random() < E_I_CHANCE) {
                    result += (ch === lower) ? 'i' : 'I';
                } else {
                    result += ch;
                }
            }
            return result;
        }

        /* ============================================================
           ЛОГИКА — без lookbehind, без for...of, без стрелок
           ============================================================ */
        var LOOKUP = new Map();
        for (var di = 0; di < DICTIONARY.length; di++) {
            var entry = DICTIONARY[di];
            var variants = Array.isArray(entry.slang) ? entry.slang : [entry.slang];
            for (var fi = 0; fi < entry.forms.length; fi++) {
                LOOKUP.set(entry.forms[fi].toLowerCase(), variants);
            }
        }

        var SORTED_KEYS = Array.from(LOOKUP.keys()).sort(function (a, b) {
            return b.length - a.length;
        });

        var lastPick = new Map();
        function pickVariant(variants, key) {
            if (variants.length === 1) return variants[0];
            var last = lastPick.get(key);
            var chosen;
            var attempts = 0;
            do {
                chosen = variants[Math.floor(Math.random() * variants.length)];
                attempts++;
            } while (chosen === last && attempts < 10);
            lastPick.set(key, chosen);
            return chosen;
        }

        function matchCase(translated, original) {
            if (!original) return translated;
            if (original === original.toUpperCase() && original.length > 1 && /[А-ЯЁA-Z]/.test(original)) {
                return translated.toUpperCase();
            }
            if (original.charAt(0) === original.charAt(0).toUpperCase() &&
                original.charAt(0) !== original.charAt(0).toLowerCase()) {
                return translated.charAt(0).toUpperCase() + translated.slice(1);
            }
            return translated;
        }

        function escapeRegex(str) {
            return str.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        }

        function isLetter(ch) {
            if (!ch) return false;
            return /[а-яёa-z]/i.test(ch);
        }

        function translate(text) {
            if (!text) return '';
            var result = text;

            for (var k = 0; k < SORTED_KEYS.length; k++) {
                var key = SORTED_KEYS[k];
                var variants = LOOKUP.get(key);
                var escaped = escapeRegex(key);
                // Без lookbehind — совместимо со всеми Safari
                var regex = new RegExp(escaped, 'gi');

                result = result.replace(regex, function (match, offset, fullStr) {
                    // Ручная проверка границ слова
                    var before = offset > 0 ? fullStr.charAt(offset - 1) : '';
                    var after = fullStr.charAt(offset + match.length) || '';

                    if (isLetter(before) || isLetter(after)) {
                        return match; // часть другого слова — не трогаем
                    }

                    var chosen = pickVariant(variants, key);
                    if (Math.random() < PREFIX_CHANCE) {
                        var prefix = PREFIXES[Math.floor(Math.random() * PREFIXES.length)];
                        chosen = prefix + chosen;
                    }
                    return matchCase(chosen, match);
                });
            }

            result = applyEI(result);
            return result;
        }

        /* ============================================================
           КНОПКА "СКОПИРОВАТЬ" — с fallback для iOS
           ============================================================ */
        function markCopied() {
            copyBtn.classList.add('copied');
            copyBtnText.textContent = 'Скопировано';
            setTimeout(function () {
                copyBtn.classList.remove('copied');
                copyBtnText.textContent = 'Скопировать';
            }, 1500);
        }

        function fallbackCopy(text) {
            var ta = document.createElement('textarea');
            ta.value = text;
            ta.style.position = 'fixed';
            ta.style.top = '0';
            ta.style.left = '0';
            ta.style.width = '1px';
            ta.style.height = '1px';
            ta.style.opacity = '0';
            ta.style.fontSize = '16px'; // чтобы iOS не зумил
            ta.setAttribute('readonly', '');
            document.body.appendChild(ta);

            // ВАЖНО для iOS: сохраняем текущее выделение
            var selection = document.getSelection();
            var originalRange = null;
            if (selection && selection.rangeCount > 0) {
                originalRange = selection.getRangeAt(0);
            }

            ta.focus();
            ta.select();
            ta.setSelectionRange(0, text.length);

            var ok = false;
            try {
                ok = document.execCommand('copy');
            } catch (e) {
                ok = false;
            }

            document.body.removeChild(ta);

            // Восстанавливаем выделение
            if (originalRange && selection) {
                selection.removeAllRanges();
                selection.addRange(originalRange);
            }

            if (ok) {
                markCopied();
            } else {
                // Совсем уж fallback — показать alert с текстом
                alert('Не удалось скопировать автоматически. Выдели текст вручную.');
            }
        }

        copyBtn.addEventListener('click', function () {
            var text = outputEl.textContent;
            if (!text) return;

            // Пробуем современный API
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(text).then(function () {
                    markCopied();
                })['catch'](function () {
                    fallbackCopy(text);
                });
            } else {
                fallbackCopy(text);
            }
        });

        /* ============================================================
           ФОН: ПАДАЮЩИЕ ИКОНКИ 192×192
           ============================================================ */
        (function initBg() {
            var canvas = document.getElementById('bgCanvas');
            if (!canvas || !canvas.getContext) return;
            var ctx = canvas.getContext('2d');

            var dpr = window.devicePixelRatio || 1;
            var W = 0, H = 0;
            var icons = [];
            var ICON_COUNT = 20;
            var iconImage = new Image();
            var iconLoaded = false;

            // Загружаем иконку. Она используется как источник для падающих элементов
            iconImage.onload = function () {
                iconLoaded = true;
            };
            iconImage.onerror = function () {
                // Иконки нет — фон останется пустым (без квадратов)
                iconLoaded = false;
            };
            iconImage.src = 'icon-192.png';

            function resize() {
                dpr = window.devicePixelRatio || 1;
                W = window.innerWidth;
                H = window.innerHeight;
                canvas.width = Math.floor(W * dpr);
                canvas.height = Math.floor(H * dpr);
                canvas.style.width = W + 'px';
                canvas.style.height = H + 'px';
                ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            }

            function createIcon(initial) {
                var size = 40 + Math.random() * 60; // 40-100 px
                return {
                    x: Math.random() * W,
                    y: initial ? Math.random() * H : -size - Math.random() * 200,
                    size: size,
                    speed: 0.3 + Math.random() * 1.1,
                    rotation: Math.random() * Math.PI * 2,
                    rotationSpeed: (Math.random() - 0.5) * 0.02,
                    opacity: 0.06 + Math.random() * 0.16,
                    drift: (Math.random() - 0.5) * 0.3,
                    wobble: Math.random() * Math.PI * 2,
                    wobbleSpeed: 0.005 + Math.random() * 0.01
                };
            }

            function initIcons() {
                icons = [];
                for (var i = 0; i < ICON_COUNT; i++) {
                    icons.push(createIcon(true));
                }
            }

            function draw() {
                ctx.clearRect(0, 0, W, H);

                if (iconLoaded) {
                    for (var i = 0; i < icons.length; i++) {
                        var s = icons[i];
                        s.y += s.speed;
                        s.x += s.drift;
                        s.rotation += s.rotationSpeed;
                        s.wobble += s.wobbleSpeed;

                        if (s.y - s.size > H + 40) {
                            icons[i] = createIcon(false);
                            continue;
                        }

                        ctx.save();
                        ctx.globalAlpha = s.opacity;
                        ctx.translate(s.x, s.y);
                        ctx.rotate(s.rotation);
                        var scale = 0.9 + Math.sin(s.wobble) * 0.1;
                        ctx.scale(scale, scale);
                        ctx.drawImage(iconImage, -s.size / 2, -s.size / 2, s.size, s.size);
                        ctx.restore();
                    }
                }

                requestAnimationFrame(draw);
            }

            document.addEventListener('visibilitychange', function () {
                // Ничего не делаем — draw() уже крутится через rAF, браузер сам
                // приостанавливает rAF в фоне. Этого достаточно.
            });

            window.addEventListener('resize', function () {
                resize();
                initIcons();
            });

            resize();
            initIcons();
            draw();
        })();

        /* ============================================================
           PWA: Service Worker (в try/catch — на iOS в Safari не работает)
           ============================================================ */
        try {
            if ('serviceWorker' in navigator) {
                window.addEventListener('load', function () {
                    navigator.serviceWorker.register('sw.js')['catch'](function (err) {
                        // Тихо игнорируем — на iOS Safari это нормально
                    });
                });
            }
        } catch (e) { }

        /* ============================================================
           PWA: Кнопка "Установить приложение" (Android / ПК)
           На iOS этого события нет — кнопка не появится, это норм.
           ============================================================ */
        try {
            var deferredPrompt = null;
            var installBtn = document.createElement('button');
            installBtn.type = 'button';
            installBtn.textContent = '⬇ Установить приложение';
            installBtn.className = 'btn';
            installBtn.style.display = 'none';
            installBtn.style.marginTop = '0';
            installBtn.style.background = 'rgba(255,255,255,0.15)';
            installBtn.style.color = '#fff';
            installBtn.style.border = '1px solid rgba(255,255,255,0.25)';

            window.addEventListener('beforeinstallprompt', function (e) {
                e.preventDefault();
                deferredPrompt = e;
                installBtn.style.display = 'block';
            });

            installBtn.addEventListener('click', function () {
                if (!deferredPrompt) return;
                deferredPrompt.prompt();
                deferredPrompt.userChoice.then(function () {
                    deferredPrompt = null;
                    installBtn.style.display = 'none';
                });
            });

            var translateBtnEl = document.getElementById('translateBtn');
            if (translateBtnEl && translateBtnEl.parentNode) {
                translateBtnEl.parentNode.insertBefore(installBtn, translateBtnEl.nextSibling);
            }
        } catch (e) { }

        /* ============================================================
           ДИАГНОСТИКА: покажет ошибку прямо на странице
           ============================================================ */
        window.addEventListener('error', function (e) {
            if (statsEl) {
                statsEl.textContent = 'Ошибка: ' + (e.message || 'unknown');
                statsEl.style.color = '#ff8a8a';
            }
        });
    </script>
</body>

</html>
